name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      API_TOKEN: ci-test-token
      REDIS_URL: fake://
      LLM_PROVIDER: mock
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -m "not docker" --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py -v

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: day12-chat:${{ github.sha }}

  deploy:
    name: Deploy Railway
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install --global @railway/cli
      - name: Deploy service
        run: railway up --service chat --project "$RAILWAY_PROJECT_ID" --environment production --ci --detach --message "CI deploy $GITHUB_SHA"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      - name: Smoke test
        run: |
          sleep 45
          curl --fail --silent --show-error "$PUBLIC_URL/healthz"
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
